<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0040cc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.5" ry="13.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Top highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="20" rx="13.5" ry="13.5" fill="rgba(255,255,255,0.04)"/>

  <!-- "A" lettermark — bold angular strokes -->
  <g filter="url(#glow)">
    <!-- Left diagonal leg -->
    <polygon points="14,50 22,50 32,18 27,18" fill="url(#letter)"/>
    <!-- Right diagonal leg -->
    <polygon points="42,50 50,50 37,18 32,18" fill="url(#letter)"/>
    <!-- Crossbar -->
    <rect x="20" y="34" width="24" height="5.5" rx="1" fill="url(#letter)"/>
  </g>

  <!-- Electric dot accent -->
  <circle cx="56" cy="10" r="2.5" fill="#0066ff" opacity="0.9"/>
</svg>
