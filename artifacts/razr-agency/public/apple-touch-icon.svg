<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0040cc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="180" height="180" rx="40" ry="40" fill="url(#bg)"/>
  <rect x="2" y="2" width="176" height="176" rx="38" ry="38" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <rect x="2" y="2" width="176" height="55" rx="38" ry="38" fill="rgba(255,255,255,0.04)"/>

  <g filter="url(#glow)">
    <polygon points="38,140 62,140 90,48 76,48" fill="url(#letter)"/>
    <polygon points="118,140 142,140 104,48 90,48" fill="url(#letter)"/>
    <rect x="56" y="96" width="68" height="16" rx="3" fill="url(#letter)"/>
  </g>

  <circle cx="158" cy="28" r="7" fill="#0066ff" opacity="0.9"/>
</svg>
